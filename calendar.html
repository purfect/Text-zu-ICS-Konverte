<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termin exportieren</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; --bg: #151a1f; --surface: #202830; --line: #3b4751; --text: #edf3f6; --muted: #a9b6be; --accent: #32b9ce; --danger: #ff9a91; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { padding: 24px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: #123c45; color: var(--accent); font-size: 18px; }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 6px; margin-bottom: 14px; color: var(--muted); font-size: .82rem; font-weight: 600; }
    label.full { grid-column: 1 / -1; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--text); font: inherit; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    textarea { min-height: 86px; resize: vertical; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 6px; }
    #error { margin: 0; min-height: 1.3em; color: var(--danger); font-size: .82rem; }
    button { flex: 0 0 auto; padding: 10px 14px; border: 0; border-radius: 5px; background: var(--accent); color: #06242a; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #65d3e2; }
  </style>
</head>
<body>
  <main>
    <header><span class="mark">+</span><h1>Termin nach Outlook</h1></header>
    <div class="fields">
      <label class="full">Betreff <input id="subject" type="text" required></label>
      <label>Datum <input id="date" type="date" required></label>
      <label>Bereich / Ort <input id="location" type="text"></label>
      <label>Beginn <input id="start" type="time" required></label>
      <label>Ende <input id="end" type="time" required></label>
      <label class="full">Beschreibung <textarea id="body"></textarea></label>
    </div>
    <footer><p id="error" role="alert"></p><button id="export" type="button">Für Outlook erstellen</button></footer>
  </main>
  <script src="calendar.js"></script>
</body>
</html>
